<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#050505">

  <title>Snap+ Services</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont,
                   "SF Pro Display", Arial, sans-serif;

      color: white;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 10%,
          rgba(255, 252, 0, .18),
          transparent 28%),

        radial-gradient(circle at 90% 80%,
          rgba(255, 200, 0, .14),
          transparent 30%),

        linear-gradient(145deg,
          #020202,
          #0c0c0c 45%,
          #181600);
    }

    /* خلفية متحركة */
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: .25;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      width: 180px;
      height: 180px;
      background: #fffc00;
      top: 5%;
      left: -60px;
    }

    .orb.two {
      width: 230px;
      height: 230px;
      background: #ffd000;
      bottom: 5%;
      right: -100px;
      animation-delay: -3s;
    }

    .orb.three {
      width: 120px;
      height: 120px;
      background: #fff700;
      top: 45%;
      right: 10%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(20px, -25px);
      }
    }

    .page {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 480px;

      margin: auto;

      padding:
        calc(35px + env(safe-area-inset-top))
        22px
        calc(30px + env(safe-area-inset-bottom));

      text-align: center;
    }

    /* الشعار */
    .logo {
      width: 105px;
      height: 105px;

      margin: 15px auto 20px;

      border-radius: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fffc00;

      color: #050505;

      font-size: 36px;
      font-weight: 900;

      transform: rotate(-4deg);

      border: 4px solid white;

      box-shadow:
        0 0 0 6px rgba(255,252,0,.10),
        0 0 35px rgba(255,252,0,.35);

      animation: logoAnimation 3s ease-in-out infinite;
    }

    @keyframes logoAnimation {
      0%, 100% {
        transform: rotate(-4deg) scale(1);
      }

      50% {
        transform: rotate(4deg) scale(1.04);
      }
    }

    h1 {
      font-size: 32px;
      font-weight: 800;

      letter-spacing: -1px;

      margin-bottom: 8px;
    }

    .yellow {
      color: #fffc00;

      text-shadow:
        0 0 18px rgba(255,252,0,.35);
    }

    .subtitle {
      color: #a7a7a7;

      font-size: 15px;

      margin-bottom: 28px;
    }

    /* البطاقة */
    .card {
      padding: 20px;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.09),
          rgba(255,255,255,.035)
        );

      border: 1px solid rgba(255,255,255,.10);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);
    }

    /* الأزرار */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      position: relative;

      width: 100%;

      min-height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      text-decoration: none;

      color: white;

      font-size: 17px;
      font-weight: 700;

      border-radius: 18px;

      background:
        rgba(255,255,255,.07);

      border: 1px solid
        rgba(255,255,255,.10);

      overflow: hidden;

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    /* لمعان */
    .link::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.16),
          transparent
        );

      transform: skewX(-20deg);

      transition: .6s;
    }

    .link:hover::before {
      left: 140%;
    }

    .link:active {
      transform: scale(.96);
    }

    .link:hover {
      transform: translateY(-2px);

      background:
        rgba(255,252,0,.10);

      border-color:
        rgba(255,252,0,.35);

      box-shadow:
        0 10px 30px rgba(255,252,0,.10);
    }

    .icon {
      font-size: 25px;
    }

    /* Snapchat */
    .snapchat {
      background:
        linear-gradient(
          135deg,
          rgba(255,252,0,.16),
          rgba(255,255,255,.05)
        );

      border-color:
        rgba(255,252,0,.35);
    }

    /* WhatsApp */
    .whatsapp:hover {
      border-color: rgba(37,211,102,.55);

      background:
        rgba(37,211,102,.10);

      box-shadow:
        0 10px 30px rgba(37,211,102,.12);
    }

    /* النص السفلي */
    .footer {
      margin-top: 22px;

      color: #686868;

      font-size: 12px;
    }

    .verified {
      color: #fffc00;
      font-size: 13px;
    }

    /* دخول العناصر */
    .animate {
      animation: appear .7s ease both;
    }

    .delay1 {
      animation-delay: .1s;
    }

    .delay2 {
      animation-delay: .2s;
    }

    .delay3 {
      animation-delay: .3s;
    }

    .delay4 {
      animation-delay: .4s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* الشاشات الصغيرة */
    @media (max-width: 380px) {

      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        font-size: 28px;
      }

      .logo {
        width: 90px;
        height: 90px;
        font-size: 31px;
      }

      .link {
        min-height: 58px;
      }
    }
  </style>
</head>

<body>

  <!-- الخلفية -->
  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>


  <main class="page">

    <!-- الشعار -->
    <div class="logo animate">
      S+
    </div>


    <!-- العنوان -->
    <h1 class="animate delay1">
      <span class="yellow">Snap+</span> Services
    </h1>

    <p class="subtitle animate delay2">
      جميع روابطنا الرسمية
      <span class="verified">✓</span>
    </p>


    <!-- الروابط -->
    <section class="card animate delay2">

      <div class="links">

        <!-- Snapchat -->
        <a
          class="link snapchat"
          href="https://snapchat.com/t/VBO4Ft6Y"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">👻</span>
          <span>Snapchat</span>
        </a>


        <!-- Instagram -->
        <a
          class="link"
          href="https://www.instagram.com/x_islam_msd/"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">📸</span>
          <span>Instagram</span>
        </a>


        <!-- TikTok -->
        <a
          class="link"
          href="https://www.tiktok.com/@islam_msd_22"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">🎵</span>
          <span>TikTok</span>
        </a>


        <!-- WhatsApp -->
        <a
          class="link whatsapp"
          href="https://wa.me/213708503004"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">💬</span>
          <span>WhatsApp</span>
        </a>

      </div>

    </section>


    <div class="footer animate delay4">
      © 2026 Snap+ Services
    </div>

  </main>

</body>
</html>
